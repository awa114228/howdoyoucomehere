<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>神秘的網站</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap');
        body {
            font-family: 'Noto Sans TC', sans-serif;
        }
        
        /* 訊息提示的動畫 */
        @keyframes fadeInOut {
            0% { opacity: 0; transform: translate(-50%, 20px); }
            10% { opacity: 1; transform: translate(-50%, 0); }
            90% { opacity: 1; transform: translate(-50%, 0); }
            100% { opacity: 0; transform: translate(-50%, -20px); }
        }
        
        .toast-animate {
            animation: fadeInOut 2.5s ease-in-out forwards;
        }
    </style>
</head>
<body class="bg-white text-gray-800 h-screen w-screen flex flex-col justify-between items-center overflow-hidden relative">

    <!-- 頂部佔位 -->
    <div></div>

    <!-- 中間主要文字 -->
    <main class="text-center px-4">
        <h1 class="text-3xl md:text-5xl lg:text-6xl font-bold tracking-wider leading-tight">
            WTH 你個SB是怎麼進來的！？🧐
        </h1>
    </main>

    <!-- 底部按鈕區 -->
    <footer class="w-full pb-10 flex justify-center">
        <button 
            id="copy-btn"
            class="bg-red-500 hover:bg-red-600 text-white font-bold py-3 px-8 rounded-full shadow-lg transform transition duration-200 hover:scale-105 active:scale-95 focus:outline-none flex items-center space-x-2"
        >
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
            </svg>
            <span>產生新的受害者</span>
        </button>
    </footer>

    <!-- 複製成功的提示訊息 -->
    <div 
        id="toast" 
        class="fixed bottom-24 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-6 py-3 rounded-lg shadow-xl opacity-0 pointer-events-none transition-opacity duration-300 z-50 flex items-center space-x-2"
    >
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-green-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <span>成功複製邪惡連結！去尋找下一個受害者吧 😈</span>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const copyBtn = document.getElementById('copy-btn');
            const toast = document.getElementById('toast');
            let isAnimating = false;

            copyBtn.addEventListener('click', () => {
                // 取得當前網址
                const currentUrl = window.location.href;
                
                // 創建一個臨時的 textarea 元素來執行複製動作
                // (使用 textarea 是為了更好的相容性，尤其在 iFrame 或是某些限制的環境中)
                const tempTextArea = document.createElement("textarea");
                tempTextArea.value = currentUrl;
                
                // 讓這個 textarea 隱藏在畫面外
                tempTextArea.style.position = "absolute";
                tempTextArea.style.left = "-9999px";
                document.body.appendChild(tempTextArea);
                
                // 選擇文字並執行複製
                tempTextArea.select();
                tempTextArea.setSelectionRange(0, 99999); // 給行動裝置的相容性
                
                try {
                    document.execCommand("copy");
                    showToast();
                } catch (err) {
                    console.error('複製失敗:', err);
                    // 備用方案：嘗試使用 clipboard API (如果在 HTTPS 或 localhost 且允許的情況下)
                    if (navigator.clipboard && window.isSecureContext) {
                        navigator.clipboard.writeText(currentUrl).then(showToast).catch(e => console.error("Clipboard API failed", e));
                    }
                } finally {
                    // 移除臨時元素
                    document.body.removeChild(tempTextArea);
                }
            });

            function showToast() {
                if (isAnimating) return;
                
                isAnimating = true;
                
                // 移除先前的動畫 class
                toast.classList.remove('toast-animate');
                
                // 觸發重繪 (reflow) 讓瀏覽器知道需要重新計算動畫
                void toast.offsetWidth;
                
                // 加入動畫 class
                toast.classList.add('toast-animate');
                
                // 動畫結束後重置狀態
                setTimeout(() => {
                    toast.classList.remove('toast-animate');
                    isAnimating = false;
                }, 2500); // 這裡的時間對應 CSS 動畫長度
            }
        });
    </script>
</body>
</html>
